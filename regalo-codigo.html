<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un regalo para Ema</title>
<style>
:root{--navy:#0a1a3f;--gold:#ffd166;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 42%,#14306b 0%,#0a1a3f 55%,#061230 100%) fixed,#0a1a3f;color:#fff;font-family:"Trebuchet MS",Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;overflow-x:hidden}
.hint{margin-top:18px;color:var(--gold);font-size:1.1rem;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
#gift{position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;z-index:2;width:min(260px,72vw);border:0;background:none;padding:0;cursor:pointer;animation:bob 2s ease-in-out infinite}
#gift img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
@keyframes bob{50%{transform:translateY(-10px)}}
.tag{position:absolute;left:16%;bottom:20%;background:#fff;color:var(--navy);padding:6px 10px;border-radius:4px;font-size:.75rem;font-weight:bold;transform:rotate(-6deg);line-height:1.3;text-align:left;box-shadow:0 2px 6px #0006}
#gift.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
#gift.open{animation:none;transform:scale(1.5);opacity:0;transition:transform .5s,opacity .5s;pointer-events:none}
#reveal{display:none;flex-direction:column;align-items:center}
#reveal.show{display:flex;animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.2) translateY(60px);opacity:0}}
#reveal svg{width:min(360px,92vw);height:auto}
h1{font-size:1.6rem;margin:6px 0 4px;color:var(--gold)}
p{margin:2px 0;font-size:1.15rem}
#wrap,#reveal{position:relative;z-index:0}
#wrap:before,#reveal:before{content:"";position:absolute;z-index:-1;left:50%;top:44%;width:min(360px,88vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(120,160,255,.07)}
#wrap{padding:30px 0}
#confetti{display:none;position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:10}
</style>
</head>

  <h1>¡Para Ema!</h1>
  <p>Con cariño, De: Eli 💙</p>
</div>
<canvas id="confetti"></canvas>
<script>
var cv=document.getElementById('confetti'),cc=cv.getContext('2d'),parts=[],raf=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',fit);fit();
function burst(x,y,n){
  var cols=['#e63946','#d00000','#ffffff','#f4f4f4'];
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=4+Math.random()*9;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*6,h:4+Math.random()*5,
      r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],life:1});
  }
  if(!raf)loop();
}
function loop(){
  cc.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){return p.life>0&&p.y<cv.height+20});
  parts.forEach(function(p){
    p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.006;
    cc.save();cc.globalAlpha=Math.min(1,p.life*2);cc.translate(p.x,p.y);cc.rotate(p.r);
    cc.fillStyle=p.c;cc.fillRect(-p.w/2,-p.h/2,p.w,p.h);cc.restore();
  });
  raf=parts.length?requestAnimationFrame(loop):0;
}
var g=document.getElementById('gift'),opened=false;
function openGift(e){
  if(opened)return;opened=true;
  if(e&&e.preventDefault)e.preventDefault();
  document.getElementById('hint').style.display='none';
  g.classList.add('shake');
  setTimeout(function(){
    try{cv.style.display='block';var r=g.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,150);}catch(err){}
    g.classList.remove('shake');g.classList.add('open');
  },500);
  setTimeout(function(){
    document.getElementById('wrap').style.display='none';
    document.getElementById('reveal').classList.add('show');
    try{burst(innerWidth/2,innerHeight*.4,90);}catch(err){}
  },1000);
}
['click','touchend'].forEach(function(ev){
  g.addEventListener(ev,openGift);
  document.getElementById('hint').addEventListener(ev,openGift);
});
</script>
